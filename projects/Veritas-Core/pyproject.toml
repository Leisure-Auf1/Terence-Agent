[project]
name = "veritas_core"
version = "1.0.0"
description = "Veritas_Core — Trustworthy Personalized Learning Multi-Agent System"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Veritas_Core Team"}
]
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "redis>=5.0",
    "chromadb>=0.5",
    "psycopg2-binary>=2.9",
    "sentence-transformers>=3.0",
    "pytest>=8.0",
    "python-pptx>=0.6",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
